[project]
name = "auditrag"
version = "0.1.0"
description = "General-purpose RAG knowledge base system"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic-settings",
    "psycopg[binary]",
    "qdrant-client",
    "sqlalchemy",
    "uvicorn[standard]",
    "datasets",
    "pdfplumber",
    "python-multipart",
    "httpx",
    "openai",
    "anthropic",
    "sentence-transformers",
    "rank-bm25",
    "cohere",
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["auditrag"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
